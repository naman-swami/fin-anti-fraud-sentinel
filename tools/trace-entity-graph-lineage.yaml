annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Traverse financial entity graphs to discover common beneficiary owners
  and shared IP infrastructure.
input_schema:
  additionalProperties: false
  properties:
    max_hops:
      type: number
    root_account_id:
      type: string
  required:
  - root_account_id
  type: object
name: trace-entity-graph-lineage
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
