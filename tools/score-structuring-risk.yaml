annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Compute statistical deviation of deposit velocity against standard deviation
  of normal behavior.
input_schema:
  additionalProperties: false
  properties:
    account_id:
      type: string
    timeframe_days:
      type: number
  required:
  - account_id
  type: object
name: score-structuring-risk
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
